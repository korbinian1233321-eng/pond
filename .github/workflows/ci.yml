name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 没有依赖要装，所以没有 npm ci
      - name: 确认 node:sqlite 可用
        run: |
          node -v
          node -e "const {DatabaseSync}=require('node:sqlite'); const d=new DatabaseSync(':memory:'); d.exec('CREATE TABLE t(a)'); console.log('node:sqlite ok')"

      - name: 接口测试
        run: npm test

      - name: 启动冒烟
        run: |
          POND_PORT=3100 POND_HOST=127.0.0.1 node --disable-warning=ExperimentalWarning server.js &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3100/api/bootstrap > /dev/null; then
              echo "服务已就绪"
              exit 0
            fi
            sleep 0.5
          done
          echo "服务 20 秒内没起来"
          exit 1

      - name: 确认示例数据能渲染
        run: |
          POND_PORT=3100 POND_HOST=127.0.0.1 node --disable-warning=ExperimentalWarning server.js &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:3100/api/bootstrap > /dev/null && break
            sleep 0.5
          done
          curl -sf 'http://127.0.0.1:3100/api/posts?limit=3' | head -c 200
          echo
          curl -sf 'http://127.0.0.1:3100/api/chat/messages?limit=3' | head -c 200

      # 这一关专门盯「爬虫能不能看见」：
      # 单页应用最容易的翻车方式是 HTML 里只剩一个空 <main>，测试全绿但站点搜不到。
      - name: 确认爬虫能看见内容
        run: |
          POND_PORT=3100 POND_HOST=127.0.0.1 node --disable-warning=ExperimentalWarning server.js &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:3100/api/bootstrap > /dev/null && break
            sleep 0.5
          done

          curl -sf http://127.0.0.1:3100/ | grep -q 'class="thread' \
            || { echo "首页 HTML 里没有楼列表"; exit 1; }

          POST=$(curl -sf 'http://127.0.0.1:3100/api/posts?limit=1' \
            | grep -o '"id":"p_[^"]*"' | head -1 | cut -d'"' -f4)
          echo "检查 /p/$POST"
          curl -sf "http://127.0.0.1:3100/p/$POST" | grep -q 'class="post-h1"' \
            || { echo "楼层页 HTML 里没有正文"; exit 1; }

          curl -sf http://127.0.0.1:3100/sitemap.xml | grep -q '<urlset' \
            || { echo "sitemap.xml 不对"; exit 1; }
          curl -sf http://127.0.0.1:3100/robots.txt | grep -q '^Sitemap:' \
            || { echo "robots.txt 里没有 Sitemap 行"; exit 1; }
          echo "服务端渲染 OK"
